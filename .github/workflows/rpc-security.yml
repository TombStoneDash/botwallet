name: RPC security

on:
  pull_request:
    paths:
      - "sql/**"
      - "tests/security/**"
      - "packages/db/**"
      - "packages/ledger/**"
      - "packages/policy/**"
      - "apps/web/src/app/api/v1/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/rpc-security.yml"
  push:
    branches:
      - main
    paths:
      - "sql/**"
      - "tests/security/**"
      - "packages/db/**"
      - "packages/ledger/**"
      - "packages/policy/**"
      - "apps/web/src/app/api/v1/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/rpc-security.yml"

permissions:
  contents: read

concurrency:
  group: rpc-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused RPC security tests
        run: pnpm test:security

      - name: Build application
        run: pnpm build
